<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review · N2 Companion</title><link rel="stylesheet" href="styles.css"></head><body><main class="page">
  <header class="page-header"><div><p class="eyebrow">N2 COMPANION</p><h1>Daily review</h1></div><span id="progress" class="progress"></span></header>
  <section id="reviewCard" class="card" hidden><div id="term" class="term"></div><div id="context" class="context"></div><a id="source" class="source" target="_blank" rel="noreferrer"></a><div id="answer" class="answer" hidden><div id="reading" class="reading"></div><p id="meanings" class="meanings"></p><p id="parts" class="progress"></p></div><button id="reveal" class="primary" style="margin-top:22px">Reveal reading & meaning</button><div id="grades" class="grades" hidden><button data-grade="0" class="grade again">Again<br><small>10 min</small></button><button data-grade="1" class="grade hard">Hard</button><button data-grade="2" class="grade good">Good</button><button data-grade="3" class="grade easy">Easy</button></div></section>
  <section id="finished" class="card empty" hidden><h2>Review complete</h2><p>You cleared every card that was due. Nice work.</p><button id="close" class="secondary">Close tab</button></section>
</main><script type="module" src="review.js"></script></body></html>
