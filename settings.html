<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · N2 Companion</title><link rel="stylesheet" href="styles.css"></head><body><main class="page"><header class="page-header"><div><p class="eyebrow">N2 COMPANION</p><h1>Settings</h1></div></header>
<section class="card"><form id="form" class="form"><div class="field"><label for="examDate">JLPT exam date</label><input id="examDate" type="date" required></div><div class="field"><label for="dailyGoal">Daily review goal</label><input id="dailyGoal" type="number" min="1" max="500" required><small>Reviews rather than unique cards.</small></div><label class="toggle"><input id="chineseMode" type="checkbox"><span><b>Kanji-background mode</b><br><small>Prioritize Japanese readings and usage over handwriting.</small></span></label><label class="toggle"><input id="readingFirst" type="checkbox"><span><b>Reading-first cards</b><br><small>Test Japanese pronunciation before showing English meanings.</small></span></label><div><button class="primary" type="submit" style="max-width:220px">Save settings</button></div><div id="notice" class="notice">Settings saved.</div></form></section>
<h2 class="section-title">Your data</h2><section class="card"><p>Your cards stay in this browser. Export a backup before reinstalling the extension.</p><div class="actions"><button id="export" class="secondary">Export JSON backup</button><label class="secondary">Import backup<input id="import" type="file" accept="application/json" hidden></label></div></section></main><script type="module" src="settings.js"></script></body></html>
