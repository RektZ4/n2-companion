<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library · N2 Companion</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="library-page">
  <header class="library-header"><div><p class="eyebrow">N2 COMPANION</p><h1>My Library</h1><p>Every saved card, source, and review stays here.</p></div><div class="actions"><button id="backup" class="secondary">Download backup</button><button id="newDeck" class="primary compact">New deck</button></div></header>
  <section class="library-stats"><div><b id="statCards">0</b><span>cards</span></div><div><b id="statReviews">0</b><span>reviews</span></div><div><b id="statAccuracy">0%</b><span>accuracy</span></div><div><b id="statLapses">0</b><span>lapses</span></div></section>
  <div class="library-layout"><aside><nav id="deckList" class="deck-list"></nav><button id="archiveDeck" class="secondary" hidden></button></aside><section><div class="library-tools"><input id="search" type="search" placeholder="Search words, readings, meanings, sentences…"><select id="stateFilter"><option value="all">All cards</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div><div id="cardList" class="library-cards"></div></section></div>
</main>
<dialog id="cardDialog" class="card-dialog"><form id="cardForm" method="dialog"><header><h2>Edit card</h2><button type="button" id="closeDialog" class="icon-button">×</button></header><div class="edit-grid"><label>Word<input id="editTerm" required></label><label>Reading<input id="editReading"></label><label class="wide">Meanings<textarea id="editMeanings" rows="3"></textarea></label><label class="wide">Original sentence<textarea id="editContext" rows="3"></textarea></label><label class="wide">Personal notes / mnemonic<textarea id="editNotes" rows="3"></textarea></label><label>Deck<select id="editDeck"></select></label><label>Tags<input id="editTags" placeholder="N2, grammar"></label><label class="toggle"><input id="editSuspended" type="checkbox"><span><b>Suspend card</b><br><small>Keep it without scheduling reviews.</small></span></label></div><img id="editScreenshot" class="review-screenshot" hidden><a id="editSource" class="source" target="_blank" rel="noreferrer"></a><div id="cardHistory" class="history"></div><div id="cardOccurrences" class="history"></div><div id="reviewHistory" class="history"></div><footer><button type="button" id="deleteCard" class="danger">Delete</button><span></span><label>Copy to <select id="copyDeck"></select></label><button type="button" id="copyCard" class="secondary">Copy</button><button value="save" class="primary compact">Save changes</button></footer></form></dialog>
<script type="module" src="library.js"></script></body></html>
